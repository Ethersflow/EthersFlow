[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethersflow"
version = "0.1.1"
description = "EthersFlow Python SDK — lightweight client + LangChain tool wrapper"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EthersFlow", email = "dev@ethersflow.com" }]
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]
