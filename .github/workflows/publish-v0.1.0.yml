name: Publish v0.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate npm OTP secret
        run: |
          if [ -z "${{ secrets.NPM_OTP }}" ]; then
            echo "NPM_OTP secret must be set to the current 6-digit authenticator code before running this workflow." >&2
            exit 1
          fi

      - name: Publish @ethersflow/mcp-server
        working-directory: mcp-server
        run: npm publish --access public --otp=${{ secrets.NPM_OTP }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install and build @ethersflow/sdk
        working-directory: sdk/typescript
        run: npm install && npm run build

      - name: Publish @ethersflow/sdk
        working-directory: sdk/typescript
        run: npm publish --access public --otp=${{ secrets.NPM_OTP }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Build ethersflow
        working-directory: sdk/python
        run: python -m build

      - name: Publish ethersflow to PyPI
        working-directory: sdk/python
        run: python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  tag-and-release:
    name: Tag and create GitHub release
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi]
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create v0.1.0 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v0.1.0 || echo "Tag already exists, continuing"

      - name: Push tag
        run: git push origin v0.1.0 || echo "Tag already pushed, continuing"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'v0.1.0',
                name: 'v0.1.0',
                body: [
                  '## EthersFlow v0.1.0',
                  '',
                  '### Packages Published',
                  '- 📦 [`@ethersflow/mcp-server`](https://www.npmjs.com/package/@ethersflow/mcp-server) — MCP server for adversarial multi-model consensus',
                  '- 📦 [`@ethersflow/sdk`](https://www.npmjs.com/package/@ethersflow/sdk) — TypeScript SDK',
                  '- 🐍 [`ethersflow`](https://pypi.org/project/ethersflow/) — Python SDK',
                  '',
                  '### Installation',
                  '```bash',
                  '# MCP server',
                  'npx @ethersflow/mcp-server',
                  '',
                  '# TypeScript SDK',
                  'npm install @ethersflow/sdk',
                  '',
                  '# Python SDK',
                  'pip install ethersflow',
                  '```',
                ].join('\n'),
                generate_release_notes: true,
              });
              console.log('Release created successfully');
            } catch (e) {
              if (e.status === 422) {
                console.log('Release already exists, skipping');
              } else {
                throw e;
              }
            }

  verify:
    name: Verify packages are live
    runs-on: ubuntu-latest
    needs: [tag-and-release]
    steps:
      - name: Wait for registry sync
        run: sleep 30

      - name: Verify npm packages
        run: |
          npm view @ethersflow/mcp-server@0.1.0 version
          npm view @ethersflow/sdk@0.1.0 version

      - name: Verify PyPI package
        run: pip index versions ethersflow | grep 0.1.0

      - name: Test MCP server installation
        run: npx --yes @ethersflow/mcp-server --version || echo "MCP server installed (no --version flag)"

      - name: Summary
        run: |
          echo "## ✅ v0.1.0 Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Registry | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| @ethersflow/mcp-server | npm | 0.1.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| @ethersflow/sdk | npm | 0.1.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| ethersflow | PyPI | 0.1.0 |" >> $GITHUB_STEP_SUMMARY
